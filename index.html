<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernraum</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--sf:#fff;--sf2:#f0f1f4;--bd:#e4e6eb;--tx:#17181c;--ts:#6d7078;--ac:#5457e0;--as:#eeeeff;--ok:#2f9e64;--no:#d24d4d;--r:14px;--side:240px}
html[data-theme=dark]{--bg:#121316;--sf:#1a1b20;--sf2:#23252b;--bd:#2c2e36;--tx:#ecedf1;--ts:#9a9ea9;--ac:#8b8df7;--as:#24254a}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.6 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
a{color:inherit;text-decoration:none}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1,h2,.serif{font-family:"IBM Plex Serif",Georgia,serif;font-weight:500;letter-spacing:-.01em}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--sf);border-right:1px solid var(--bd);padding:20px 12px;display:flex;flex-direction:column;gap:2px;z-index:20;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:600;font-size:17px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--ac);color:#fff;display:grid;place-items:center;font:600 15px "IBM Plex Serif",serif}
.nl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ts);font-size:14px}
.nl:hover{background:var(--sf2);color:var(--tx)}.nl.on{background:var(--as);color:var(--ac);font-weight:600}
.nl small{margin-left:auto;font-size:12px;opacity:.7}
.sh{padding:16px 10px 6px;font-size:12px;color:var(--ts)}
.grow{flex:1}
.main{margin-left:var(--side)}
.top{position:sticky;top:0;z-index:10;height:62px;display:flex;align-items:center;gap:10px;padding:0 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.top input{flex:1;max-width:460px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);outline:none}
.top input:focus{border-color:var(--ac)}
.ib{width:36px;height:36px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);display:grid;place-items:center}
.burger{display:none}
.btn{padding:8px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);font-size:14px}
.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.on{background:var(--as);color:var(--ac);border-color:transparent}
.content{width:min(1080px,100% - 48px);margin:0 auto;padding:36px 0 80px}
h1{font-size:clamp(26px,4vw,36px);line-height:1.15}
.sub{color:var(--ts);margin-top:8px;max-width:640px}
.crumb{font-size:13px;color:var(--ts);margin-bottom:10px}.crumb a:hover{color:var(--ac)}
h3.sec{font-size:15px;font-weight:600;margin:34px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:block;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:18px}
a.card:hover{border-color:var(--ac)}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px;font-size:16px;background:hsl(var(--h) 70% 94%);color:hsl(var(--h) 50% 36%)}
html[data-theme=dark] .ico{background:hsl(var(--h) 30% 21%);color:hsl(var(--h) 75% 78%)}
.card b{display:block;font-weight:600}.card p{color:var(--ts);font-size:13px;margin-top:4px}
.bar{height:4px;border-radius:9px;background:var(--sf2);margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.list{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--bd)}.row:first-child{border-top:0}
.row:hover{background:var(--sf2)}.row .ico{margin:0;flex:none;width:34px;height:34px}
.row div{flex:1;min-width:0}.row b{font-weight:500}.row p{font-size:13px;color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;color:var(--ts);white-space:nowrap}.chip.ok{color:var(--ok)}
.empty{text-align:center;padding:70px 20px;background:var(--sf);border:1px dashed var(--bd);border-radius:var(--r)}
.empty h2{font-size:22px;margin-bottom:8px}.empty p{color:var(--ts);max-width:440px;margin:0 auto 22px}.empty .btn{margin:0 4px}
/* topic */
.tl{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:44px;margin-top:30px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.meta span{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--sf2);color:var(--ts)}
.art{max-width:720px}
.art section{padding:0 0 34px;scroll-margin-top:80px}
.art h2{font-size:22px;margin-bottom:14px;display:flex;align-items:baseline;gap:10px}
.art h2 em{font:italic 400 15px "IBM Plex Serif",serif;color:var(--ac)}
.art h4{font-size:16px;font-weight:600;margin:20px 0 6px}
.art p{margin-bottom:12px;line-height:1.75}
.art ul,.art ol{padding-left:22px;margin-bottom:12px}.art li{margin:4px 0}
code{background:var(--sf2);padding:1px 6px;border-radius:5px;font-size:.9em}
.brief{background:var(--as);border-radius:var(--r);padding:20px 22px;font-size:16px;line-height:1.7}
.note{border-left:3px solid var(--ac);background:var(--sf);padding:12px 16px;margin:14px 0;border-radius:0 10px 10px 0}
.note b{display:block;font-size:13px;margin-bottom:2px}.note.an{border-color:#d99a35}
.formula{margin:14px 0;padding:18px;text-align:center;font:19px "IBM Plex Serif",serif;background:var(--sf);border:1px solid var(--bd);border-radius:10px}
.formula small{display:block;font:12px Inter,sans-serif;color:var(--ts);margin-top:4px}
.tw{overflow-x:auto;margin-bottom:12px}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--bd);padding:8px 12px;text-align:left}th{background:var(--sf2);font-weight:600}
dl div{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:11px 0;border-top:1px solid var(--bd)}dl div:first-child{border:0}
dt{font-weight:600}dd{color:var(--ts)}
.vz{margin-bottom:16px}.vz iframe{width:100%;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf)}
.vz figcaption{font-size:13px;color:var(--ts);margin-top:6px}
.ex,.task{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px 20px;margin-bottom:12px}
.ex ol{color:var(--ts);margin:8px 0 0}.ex .ans{margin-top:10px;font-weight:500}
.lv{float:right;font-size:12px;color:var(--ts);background:var(--sf2);padding:2px 10px;border-radius:99px}
details{margin-top:10px}summary{cursor:pointer;color:var(--ac);font-size:14px}
details p{background:var(--sf2);border-radius:10px;padding:10px 14px;margin:8px 0 0;font-size:14px}
.q{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px 20px;margin-bottom:12px}
.q>b{display:block;margin-bottom:10px;font-weight:600}
.q button.o{display:block;width:100%;text-align:left;padding:9px 14px;margin-bottom:6px;border:1px solid var(--bd);border-radius:10px;background:none}
.q button.o:hover{border-color:var(--ac)}.q .o.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.q .o.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,transparent)}
.q .ex2{font-size:13px;color:var(--ts);margin-top:6px}.score{font-weight:600;margin-top:4px}
.cheat{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:18px 22px}.cheat ul{margin:0}
.toc{position:sticky;top:86px;align-self:start;border-left:1px solid var(--bd)}
.toc a{display:block;padding:6px 14px;font-size:13px;color:var(--ts);margin-left:-1px;border-left:2px solid transparent}
.toc a.on{color:var(--ac);border-color:var(--ac);font-weight:500}
/* dialog / toast */
dialog{margin:auto;width:min(560px,calc(100% - 28px));border:1px solid var(--bd);border-radius:18px;background:var(--sf);color:var(--tx);padding:24px}
dialog::backdrop{background:rgba(10,10,20,.45)}
dialog h2{font-size:20px;margin-bottom:6px}dialog p{color:var(--ts);font-size:14px;margin-bottom:14px}
dialog textarea{width:100%;height:130px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);resize:vertical;font:13px ui-monospace,monospace}
.dr{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.dr .grow{flex:1}
body.drag::after{content:"Addon hier ablegen";position:fixed;inset:12px;border:2px dashed var(--ac);border-radius:18px;background:color-mix(in srgb,var(--bg) 80%,transparent);display:grid;place-items:center;font-size:20px;color:var(--ac);z-index:50}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60}
#toast div{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw}
@media(max-width:900px){.side{transform:translateX(-100%);transition:transform .2s}.side.open{transform:none}.main{margin-left:0}.burger{display:grid}.top{padding:0 14px}.content{width:calc(100% - 28px);padding-top:24px}.tl{grid-template-columns:1fr}.toc{display:none}dl div{grid-template-columns:1fr;gap:2px}.top .btn span{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"></aside>
<div class="main">
  <header class="top">
    <button class="ib burger" data-act="menu" aria-label="Menü">☰</button>
    <input id="q" type="search" placeholder="Themen und Begriffe suchen">
    <button class="ib" data-act="theme" aria-label="Design wechseln">◐</button>
    <button class="btn p" data-act="add">+ <span>Addon</span></button>
  </header>
  <div class="content" id="view"></div>
</div>
</div>

<dialog id="dlg">
  <h2>Addon hinzufügen</h2>
  <p>Wähle die JSON-Datei(en) aus oder füge den Text direkt ein. Ein Addon mit gleicher ID wird aktualisiert.</p>
  <textarea id="paste" placeholder='{"format":"lernraum-addon", …}'></textarea>
  <div class="dr">
    <button class="btn p" data-act="import-paste">Einfügen &amp; hinzufügen</button>
    <button class="btn" data-act="pick">Datei wählen</button>
    <span class="grow"></span>
    <button class="btn" data-act="spec">KI-Prompt kopieren</button>
    <button class="btn" data-act="close">Schließen</button>
  </div>
  <input type="file" id="file" accept=".json,application/json" multiple hidden>
</dialog>
<div id="toast"></div>

<script>
/* ============ Konstanten ============ */
const DEMO = {format:"lernraum-addon",version:1,id:"chemie-saeuren-und-basen",subject:"Chemie",title:"Säuren und Basen",subtitle:"Protonen, pH-Wert und Neutralisation.",grade:"9",minutes:12,tags:["pH","Neutralisation"],
brief:"Säuren geben Protonen (H⁺) ab, Basen nehmen sie auf. Der pH-Wert zeigt, wie sauer oder basisch eine Lösung ist. Mischt man beide, entsteht durch Neutralisation Wasser und ein Salz.",
explain:[{heading:"Das Protonen-Konzept",body:["Nach Brønsted ist eine **Säure** ein Protonendonator und eine **Base** ein Protonenakzeptor.",{type:"formula",text:"HCl + H_{2}O → H_{3}O^{+} + Cl^{−}",caption:"Salzsäure gibt ein Proton an Wasser ab"},{type:"analogy",text:"Ein Proton ist wie ein Ball: Die Säure wirft ihn, die Base fängt ihn."}]},
{heading:"Der pH-Wert",body:["Die Skala reicht von 0 bis 14. Jede Stufe bedeutet den Faktor 10.",{type:"table",head:["pH","Wirkung","Beispiel"],rows:[["< 7","sauer","Zitronensaft"],["7","neutral","Wasser"],["> 7","basisch","Seifenlauge"]]},{type:"note",title:"Merke",text:"pH 3 ist **10-mal** saurer als pH 4."}]}],
terms:[{term:"Säure",def:"Teilchen, das Protonen abgeben kann."},{term:"Base",def:"Teilchen, das Protonen aufnehmen kann."},{term:"Neutralisation",def:"Reaktion von Säure und Base zu Wasser und Salz."}],
visuals:[{title:"pH-Skala",caption:"Von stark sauer (rot) bis stark basisch (blau).",kind:"svg",height:150,code:'<svg viewBox="0 0 420 90" width="420"><defs><linearGradient id="g"><stop offset="0" stop-color="#e5484d"/><stop offset=".5" stop-color="#30a46c"/><stop offset="1" stop-color="#3e63dd"/></linearGradient></defs><rect x="10" y="20" width="400" height="26" rx="13" fill="url(#g)"/><g fill="currentColor" font-size="12" text-anchor="middle"><text x="10" y="70">0</text><text x="210" y="70">7</text><text x="410" y="70">14</text></g></svg>'}],
examples:[{title:"pH einer 0,01-molaren HCl",steps:["HCl ist eine starke Säure und dissoziiert vollständig.","c(H₃O⁺) = 0,01 mol/l = 10^{−2} mol/l.","pH = −log(10^{−2})"],answer:"pH = 2"}],
tasks:[{level:1,text:"Nenne je ein Alltagsbeispiel für eine Säure und eine Base.",hint:"Denke an Küche und Bad.",solution:"Säure: Essig. Base: Seife."},{level:2,text:"Wie verändert sich die H₃O⁺-Konzentration von pH 5 auf pH 3?",solution:"Sie steigt um den Faktor 100."}],
quiz:[{q:"Welche Aussage über Basen stimmt?",options:["Sie geben Protonen ab","Sie nehmen Protonen auf","Sie haben immer pH 7"],correct:1,explain:"Basen sind Protonenakzeptoren."},{q:"Was entsteht bei der Neutralisation?",options:["Wasser und Salz","Nur Wasser","Säure und Gas"],correct:0}],
cheat:["Säure = Protonengeber, Base = Protonennehmer.","pH < 7 sauer, 7 neutral, > 7 basisch.","Ein pH-Schritt = Faktor 10."]};

const SPEC = `Du erstellst ein Lern-Addon für die Web-App «Lernraum». Antworte NUR mit einem gültigen JSON-Objekt (ohne Markdown-Zaun, ohne Kommentare).
Sprache der Inhalte: Deutsch (oder die Sprache des Materials). Passe Niveau und Ton an die Klassenstufe an.

Schema (alle Felder außer format, subject, title optional; lass leere Abschnitte weg):
{
 "format":"lernraum-addon","version":1,
 "id":"fach-thema-slug",            // eindeutig, klein, mit Bindestrichen
 "subject":"Chemie","title":"…","subtitle":"ein Satz","grade":"9","minutes":12,"tags":["…"],
 "brief":"2–3 Sätze: Kern des Themas",
 "explain":[{"heading":"…","body":[ "Absatz", {"type":"note","title":"Merke","text":"…"}, {"type":"analogy","text":"…"}, {"type":"formula","text":"H_{2}O, x^{2}","caption":"…"}, {"type":"list","ordered":false,"items":["…"]}, {"type":"table","head":["…"],"rows":[["…"]]} ]}],
 "terms":[{"term":"…","def":"…"}],
 "visuals":[{"title":"…","caption":"…","kind":"svg|html","height":320,"code":"<svg>…</svg> oder HTML+JS"}],
 "examples":[{"title":"…","steps":["…"],"answer":"…"}],
 "tasks":[{"level":1,"text":"…","hint":"…","solution":"…"}],   // level 1 leicht, 2 mittel, 3 schwer
 "quiz":[{"q":"…","options":["…","…","…"],"correct":0,"explain":"…"}],   // correct = Index (ab 0)
 "cheat":["Merksatz …"]
}
Textformat in Strings: **fett**, *kursiv*, \`code\`, x^{hoch}, x_{tief}. Kein HTML außer in visuals.code.
Visualisierungen: eigenständig, ohne externe Ressourcen, transparenter Hintergrund, Farben mit currentColor bzw. neutralen Tönen (funktionieren in Hell und Dunkel). Interaktive HTML/JS-Visuals sind erlaubt.
Umfang: brief, 2–4 explain-Teile, 3–6 terms, 1 visual, 1–2 examples, 3–5 tasks, 4–6 quiz, 3–5 cheat.`;

const SECS = [["brief","Kurz gesagt"],["explain","Erklärung"],["terms","Begriffe"],["visuals","Visualisierung"],["examples","Beispiele"],["tasks","Aufgaben"],["quiz","Selbsttest"],["cheat","Spickzettel"]];
const LV = {1:"Leicht",2:"Mittel",3:"Schwer"};
const ICONS = [[/chem|хим/i,"⚗"],[/phys|физ/i,"⚡"],[/math|мат|алгебр|geom/i,"∑"],[/bio|био/i,"❦"],[/gesch|hist|истор/i,"⌛"],[/inform|инфор/i,"‹›"],[/geo|гео/i,"◍"]];

/* ============ Helfer ============ */
const $ = (s, e = document) => e.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/`(.+?)`/g,"<code>$1</code>").replace(/\^\{(.+?)\}/g,"<sup>$1</sup>").replace(/_\{(.+?)\}/g,"<sub>$1</sub>");
const slug = s => String(s).normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9а-яё]+/g,"-").replace(/^-+|-+$/g,"");
const hue = s => [...s].reduce((a,c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
const icon = n => (ICONS.find(([r]) => r.test(n)) || [0, (n[0] || "?").toUpperCase()])[1];
const ico = n => `<div class="ico" style="--h:${hue(n)}">${esc(icon(n))}</div>`;
const arr = x => Array.isArray(x) ? x : [];

let db = {topics:{}, progress:{}};
let dark = false;

/* ============ Speicher (IndexedDB, Fallback: nur Arbeitsspeicher) ============ */
const idb = (m, k, v) => new Promise((res, rej) => {
  const o = indexedDB.open("lernraum", 1);
  o.onupgradeneeded = () => o.result.createObjectStore("kv");
  o.onerror = () => rej(o.error);
  o.onsuccess = () => {
    const s = o.result.transaction("kv", m === "get" ? "readonly" : "readwrite").objectStore("kv");
    const q = m === "get" ? s.get(k) : s.put(v, k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  };
});
const save = () => { try { idb("set", "db", JSON.parse(JSON.stringify(db))).catch(() => {}); } catch (e) {} };
const prog = id => db.progress[id] || (db.progress[id] = {});

/* ============ Import ============ */
function normalize(a) {
  if (!a || typeof a !== "object") throw "Kein gültiges Objekt";
  if (!a.subject || !a.title) throw "«subject» und «title» fehlen";
  if (!SECS.some(([k]) => a[k] && a[k].length)) throw "Keine Inhalte vorhanden";
  a.id = slug(a.id || a.subject + "-" + a.title);
  return a;
}
function sanitizeJsonText(t) {
  let s = t.trim();
  s = s.replace(/^```[a-zA-Z]*\n?/, "").replace(/```\s*$/, "").trim();
  s = s.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb]/g, '"').replace(/[\u2018\u2019\u201a\u201b]/g, "'");
  s = s.replace(/,(\s*[}\]])/g, "$1");
  return s;
}
// Reparatur für rohe, nicht escapte Anführungszeichen INNERHALB von JSON-Strings
// (z. B. wenn eine KI in "code": "... 'MIT "the"' ..." die inneren " vergisst).
// Heuristik: eine " im String gilt nur dann als echtes Stringende, wenn direkt danach
// (Leerraum übersprungen) eines von , } ] : oder das Textende folgt — sonst wird sie escaped.
function repairUnescapedQuotes(s) {
  let out = "", inStr = false, i = 0, n = s.length;
  while (i < n) {
    const c = s[i];
    if (!inStr) { out += c; if (c === '"') inStr = true; i++; continue; }
    if (c === "\\") { out += c + (s[i + 1] || ""); i += 2; continue; }
    if (c === '"') {
      let j = i + 1;
      while (j < n && /\s/.test(s[j])) j++;
      const next = s[j];
      if (next === undefined || ",}]:".includes(next)) { out += c; inStr = false; i++; continue; }
      out += '\\"'; i++; continue;
    }
    out += c; i++;
  }
  return out;
}
function importData(text) {
  let data, raw = text.trim();
  try { data = JSON.parse(raw); }
  catch (e1) {
    const sanitized = sanitizeJsonText(raw);
    try { data = JSON.parse(sanitized); }
    catch (e2) {
      try { data = JSON.parse(repairUnescapedQuotes(sanitized)); }
      catch (e3) { return toast("Ungültiges JSON: " + e3.message); }
    }
  }
  let added = 0, upd = 0, err = [];
  if (data && data.format === "lernraum-backup") {
    Object.assign(db.topics, data.topics || {}); Object.assign(db.progress, data.progress || {});
    added = Object.keys(data.topics || {}).length;
  } else {
    for (const a of arr(data).length ? data : [data]) {
      try {
        normalize(a);
        db.topics[a.id] ? upd++ : added++;
        a.addedAt = Date.now();
        db.topics[a.id] = a;
      } catch (e) { err.push(e); }
    }
  }
  save(); render();
  toast([added && `${added} hinzugefügt`, upd && `${upd} aktualisiert`, err.length && `Fehler: ${err[0]}`].filter(Boolean).join(" · ") || "Nichts importiert");
  if (added || upd) { $("#paste").value = ""; $("#dlg").close(); }
}
async function importFiles(files) {
  for (const f of files) importData(await f.text());
}

/* ============ UI-Helfer ============ */
function toast(msg) {
  const d = document.createElement("div"); d.textContent = msg; $("#toast").append(d);
  setTimeout(() => d.remove(), 3800);
}
async function copy(text, ok) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
  toast(ok);
}
function subjects() {
  const m = {};
  Object.values(db.topics).forEach(t => {
    const id = slug(t.subject);
    (m[id] = m[id] || {id, name:t.subject, topics:[]}).topics.push(t);
  });
  return Object.values(m).sort((a, b) => a.name.localeCompare(b.name));
}
const row = t => {
  const p = db.progress[t.id] || {};
  return `<a class="row" href="#/t/${t.id}">${ico(t.subject)}<div><b>${esc(t.title)}</b><p>${esc(t.subtitle || t.subject)}</p></div>
  ${p.quiz ? `<span class="chip">Test ${p.quiz[0]}/${p.quiz[1]}</span>` : ""}${t.minutes ? `<span class="chip">${t.minutes} min</span>` : ""}
  ${p.star ? '<span class="chip">★</span>' : ""}${p.done ? '<span class="chip ok">✓ gelernt</span>' : ""}</a>`;
};
const list = ts => `<div class="list">${ts.map(row).join("")}</div>`;
const emptyBox = msg => `<div class="empty"><p style="margin:0">${msg}</p></div>`;

/* ============ Seiten ============ */
function home() {
  const ts = Object.values(db.topics);
  if (!ts.length) return `<div class="empty"><h2>Noch keine Themen</h2>
    <p>Lass die KI ein Addon zu deinem Schulstoff erstellen und füge es hier hinzu. Es erscheint dann sofort in deiner Bibliothek.</p>
    <button class="btn p" data-act="add">Addon hinzufügen</button><button class="btn" data-act="demo">Beispiel laden</button></div>`;
  const recent = [...ts].sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0)).slice(0, 5);
  return `<h1>Lernraum</h1><p class="sub">${ts.length} Themen in ${subjects().length} Fächern</p>
  <h3 class="sec">Fächer</h3><div class="grid">${subjects().map(s => {
    const d = s.topics.filter(t => (db.progress[t.id] || {}).done).length;
    return `<a class="card" href="#/s/${s.id}">${ico(s.name)}<b>${esc(s.name)}</b><p>${s.topics.length} Themen · ${d} gelernt</p>
    <div class="bar"><i style="width:${d / s.topics.length * 100}%"></i></div></a>`;
  }).join("")}</div>
  <h3 class="sec">Zuletzt hinzugefügt</h3>${list(recent)}`;
}
function subjectPage(id) {
  const s = subjects().find(x => x.id === id);
  if (!s) return emptyBox("Fach nicht gefunden.");
  return `<div class="crumb"><a href="#/">Startseite</a></div><h1>${esc(s.name)}</h1><p class="sub">${s.topics.length} Themen</p>
  <h3 class="sec">Themen</h3>${list(s.topics.sort((a, b) => a.title.localeCompare(b.title)))}`;
}
function topicPage(id) {
  const t = db.topics[id];
  if (!t) return emptyBox("Thema nicht gefunden.");
  const p = db.progress[id] || {};
  const present = SECS.filter(([k]) => arr(t[k]).length || (k === "brief" && t.brief));
  const n = {}; present.forEach(([k], i) => n[k] = i + 1);
  const H = (k, l) => `<h2><em>${n[k]}</em>${l}</h2>`;
  const item = i => typeof i === "string" ? `<p>${fmt(i)}</p>` :
    i.type === "note" ? `<div class="note"><b>${esc(i.title || "Merke")}</b>${fmt(i.text)}</div>` :
    i.type === "analogy" ? `<div class="note an"><b>Analogie</b>${fmt(i.text)}</div>` :
    i.type === "formula" ? `<div class="formula">${fmt(i.text)}${i.caption ? `<small>${fmt(i.caption)}</small>` : ""}</div>` :
    i.type === "list" ? `<${i.ordered ? "ol" : "ul"}>${arr(i.items).map(x => `<li>${fmt(x)}</li>`).join("")}</${i.ordered ? "ol" : "ul"}>` :
    i.type === "table" ? `<div class="tw"><table><tr>${arr(i.head).map(h => `<th>${fmt(h)}</th>`).join("")}</tr>${arr(i.rows).map(r => `<tr>${arr(r).map(c => `<td>${fmt(c)}</td>`).join("")}</tr>`).join("")}</table></div>` : "";
  const frame = v => `<!doctype html><meta charset=utf-8><style>html,body{margin:0;height:100%}body{display:flex;align-items:center;justify-content:center;font:14px Inter,system-ui,sans-serif;color:${dark ? "#ecedf1" : "#17181c"}}svg{max-width:100%;height:auto}</style>${v.code}`;
  const S = {
    brief: () => `<div class="brief">${fmt(t.brief)}</div>`,
    explain: () => t.explain.map(e => `<h4>${esc(e.heading)}</h4>${arr(e.body).map(item).join("")}`).join(""),
    terms: () => `<dl>${t.terms.map(x => `<div><dt>${fmt(x.term)}</dt><dd>${fmt(x.def)}</dd></div>`).join("")}</dl>`,
    visuals: () => t.visuals.map(v => `<figure class="vz"><iframe sandbox="allow-scripts" title="${esc(v.title)}" style="height:${+v.height || 320}px" srcdoc="${esc(frame(v))}"></iframe>${v.caption ? `<figcaption>${fmt(v.caption)}</figcaption>` : ""}</figure>`).join(""),
    examples: () => t.examples.map(e => `<div class="ex"><b>${fmt(e.title)}</b>${e.task ? `<p>${fmt(e.task)}</p>` : ""}<ol>${arr(e.steps).map(s => `<li>${fmt(s)}</li>`).join("")}</ol>${e.answer ? `<div class="ans">${fmt(e.answer)}</div>` : ""}</div>`).join(""),
    tasks: () => t.tasks.map((k, i) => `<div class="task"><span class="lv">${LV[k.level] || "Mittel"}</span><b>Aufgabe ${i + 1}</b><p>${fmt(k.text)}</p>
      ${k.hint ? `<details><summary>Hinweis</summary><p>${fmt(k.hint)}</p></details>` : ""}${k.solution ? `<details><summary>Lösung</summary><p>${fmt(k.solution)}</p></details>` : ""}</div>`).join(""),
    quiz: () => `<div id="quiz" data-id="${id}" data-n="${t.quiz.length}">${t.quiz.map((q, i) => `<div class="q" data-c="${q.correct}"><b>${fmt(q.q)}</b>${arr(q.options).map((o, j) => `<button class="o" data-act="ans" data-j="${j}">${fmt(o)}</button>`).join("")}<div class="ex2" hidden>${fmt(q.explain || "")}</div></div>`).join("")}<div class="score" id="score"></div></div>`,
    cheat: () => `<div class="cheat"><ul>${t.cheat.map(c => `<li>${fmt(c)}</li>`).join("")}</ul></div>`
  };
  return `<div class="crumb"><a href="#/">Startseite</a> / <a href="#/s/${slug(t.subject)}">${esc(t.subject)}</a></div>
  <h1>${esc(t.title)}</h1>${t.subtitle ? `<p class="sub">${esc(t.subtitle)}</p>` : ""}
  <div class="meta">${[t.grade && t.grade + ". Klasse", t.minutes && t.minutes + " min", t.date, ...arr(t.tags)].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("")}</div>
  <div class="acts"><button class="btn ${p.done ? "on" : ""}" data-act="done" data-id="${id}">${p.done ? "✓ Gelernt" : "Als gelernt markieren"}</button>
  <button class="btn ${p.star ? "on" : ""}" data-act="star" data-id="${id}">${p.star ? "★ Gemerkt" : "☆ Merken"}</button>
  <button class="btn" data-act="del" data-id="${id}">Löschen</button></div>
  <div class="tl"><article class="art">${present.map(([k, l]) => `<section id="sec-${k}">${H(k, l)}${S[k]()}</section>`).join("")}</article>
  <nav class="toc">${present.map(([k, l]) => `<a href="#/t/${id}" data-sec="${k}">${l}</a>`).join("")}</nav></div>`;
}
function bookmarks() {
  const ts = Object.values(db.topics).filter(t => (db.progress[t.id] || {}).star);
  return `<h1>Merkliste</h1><p class="sub">Themen, die du mit ☆ markiert hast.</p><h3 class="sec">Themen</h3>${ts.length ? list(ts) : emptyBox("Noch nichts gemerkt.")}`;
}
function glossary() {
  const all = [];
  Object.values(db.topics).forEach(t => arr(t.terms).forEach(x => all.push({...x, t})));
  all.sort((a, b) => a.term.localeCompare(b.term));
  return `<h1>Glossar</h1><p class="sub">Alle Begriffe aus deinen Themen.</p><h3 class="sec">${all.length} Begriffe</h3>
  ${all.length ? `<div class="list card" style="padding:4px 18px"><dl>${all.map(x => `<div><dt>${fmt(x.term)}</dt><dd>${fmt(x.def)} <a class="chip" href="#/t/${x.t.id}">${esc(x.t.title)}</a></dd></div>`).join("")}</dl></div>` : emptyBox("Noch keine Begriffe.")}`;
}
function search(q) {
  const k = q.toLowerCase();
  const hit = Object.values(db.topics).filter(t => JSON.stringify([t.title, t.subtitle, t.subject, t.tags, t.brief, t.terms]).toLowerCase().includes(k));
  return `<h1>Suche</h1><p class="sub">Ergebnisse für «${esc(q)}»</p><h3 class="sec">${hit.length} Treffer</h3>${hit.length ? list(hit) : emptyBox("Nichts gefunden.")}`;
}
function settings() {
  return `<h1>Einstellungen</h1><p class="sub">Deine Daten liegen nur in diesem Browser. Sichere sie regelmäßig.</p>
  <h3 class="sec">Daten</h3><div class="card"><div class="acts" style="margin:0">
  <button class="btn" data-act="backup">Sicherung kopieren</button><button class="btn" data-act="add">Sicherung / Addon einfügen</button>
  <button class="btn" data-act="demo">Beispiel laden</button><button class="btn" data-act="wipe">Alles löschen</button></div>
  <p style="margin-top:12px">Die Sicherung ist ein Text, den du in einer Datei aufbewahrst und über «Addon hinzufügen» wiederherstellst.</p></div>
  <h3 class="sec">KI-Vorlage</h3><div class="card"><p style="margin:0 0 12px">Prompt mit dem Addon-Format, den du in dein Claude-Projekt einfügst.</p><button class="btn" data-act="spec">KI-Prompt kopieren</button></div>`;
}

/* ============ Rendering & Routing ============ */
function render() {
  const [p, a] = (location.hash.slice(2) || "").split("/").map(decodeURIComponent);
  const V = {"": home, s: () => subjectPage(a), t: () => topicPage(a), b: bookmarks, g: glossary, q: () => search(a || ""), set: settings};
  $("#view").innerHTML = (V[p] || home)();
  const cur = p === "s" ? "s/" + a : p;
  const nl = (h, l, ic, c = "") => `<a class="nl ${cur === h ? "on" : ""}" href="#/${h}">${ic} ${l}${c ? `<small>${c}</small>` : ""}</a>`;
  $("#side").innerHTML = `<div class="logo"><i>L</i>Lernraum</div>${nl("", "Startseite", "⌂")}${nl("b", "Merkliste", "★")}${nl("g", "Glossar", "▤")}
   <div class="sh">Fächer</div>${subjects().map(s => nl("s/" + s.id, esc(s.name), esc(icon(s.name)), s.topics.length)).join("") || '<div class="sh">–</div>'}
   <div class="grow"></div>${nl("set", "Einstellungen", "⚙")}`;
  $("#side").classList.remove("open");
  scrollTo(0, 0);
  spy();
}
function spy() {
  const links = [...document.querySelectorAll(".toc a")];
  if (!links.length || !window.IntersectionObserver) return;
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(l => l.classList.toggle("on", "sec-" + l.dataset.sec === e.target.id));
  }), {rootMargin: "-20% 0px -70% 0px"});
  document.querySelectorAll(".art section").forEach(s => io.observe(s));
  links[0].classList.add("on");
}

/* ============ Ereignisse ============ */
document.addEventListener("click", e => {
  const toc = e.target.closest(".toc a");
  if (toc) { e.preventDefault(); $("#sec-" + toc.dataset.sec).scrollIntoView({behavior:"smooth"}); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (act === "menu") $("#side").classList.toggle("open");
  if (act === "theme") { dark = !dark; document.documentElement.dataset.theme = dark ? "dark" : ""; try { localStorage.setItem("lr-theme", dark ? "dark" : ""); } catch (x) {} render(); }
  if (act === "add") $("#dlg").showModal();
  if (act === "close") $("#dlg").close();
  if (act === "pick") $("#file").click();
  if (act === "import-paste") importData($("#paste").value);
  if (act === "spec") copy(SPEC, "Prompt kopiert");
  if (act === "demo") importData(JSON.stringify(DEMO));
  if (act === "backup") copy(JSON.stringify({format:"lernraum-backup", topics:db.topics, progress:db.progress}), "Sicherung kopiert");
  if (act === "done" || act === "star") { const p = prog(id); p[act] = !p[act]; save(); const y = scrollY; render(); scrollTo(0, y); }
  if (act === "del" && confirm("Dieses Thema löschen?")) { delete db.topics[id]; delete db.progress[id]; save(); location.hash = "#/"; render(); }
  if (act === "wipe" && confirm("Wirklich alle Themen und Fortschritte löschen?")) { db = {topics:{}, progress:{}}; save(); render(); }
  if (act === "ans") {
    const q = b.closest(".q"); if (q.dataset.done) return;
    q.dataset.done = 1;
    const c = +q.dataset.c;
    q.querySelectorAll(".o").forEach((o, j) => o.classList.add(j === c ? "good" : (o === b ? "bad" : "x")));
    if (q.querySelector(".ex2").textContent) q.querySelector(".ex2").hidden = false;
    const box = $("#quiz"), n = +box.dataset.n;
    if (box.querySelectorAll("[data-done]").length === n) {
      const ok = [...box.querySelectorAll(".q")].filter(x => !x.querySelector(".o.bad")).length;
      $("#score").textContent = `Ergebnis: ${ok} von ${n} richtig`;
      prog(box.dataset.id).quiz = [ok, n]; save();
    }
  }
});
$("#q").addEventListener("input", e => { location.hash = e.target.value.trim() ? "#/q/" + encodeURIComponent(e.target.value.trim()) : "#/"; });
$("#file").addEventListener("change", e => { importFiles(e.target.files); e.target.value = ""; });
addEventListener("hashchange", render);
addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("drag"); });
addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("drag"); });
addEventListener("drop", e => { e.preventDefault(); document.body.classList.remove("drag"); importFiles(e.dataTransfer.files); });

/* ============ Start ============ */
(async () => {
  try { if (localStorage.getItem("lr-theme") === "dark") { dark = true; document.documentElement.dataset.theme = "dark"; } } catch (e) {}
  try { db = (await idb("get", "db")) || db; } catch (e) { toast("Speicher nicht verfügbar – Daten gehen beim Schließen verloren."); }
  render();
})();
</script>
</body>
</html>
